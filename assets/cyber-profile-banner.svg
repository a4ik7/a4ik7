<svg width="1200" height="380" viewBox="0 0 1200 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cyber-bg" x1="0" y1="0" x2="1200" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#0D1321" />
      <stop offset="100%" stop-color="#05070D" />
    </linearGradient>
    <linearGradient id="red-accent" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
