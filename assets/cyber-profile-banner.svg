    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#080C14" stop-opacity="0" />
    </radialGradient>
    <filter id="box-shadow" x="-20%" y="-20%" width="140%" height="140%">
